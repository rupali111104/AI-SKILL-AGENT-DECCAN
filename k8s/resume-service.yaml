apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-service
  namespace: ai-recruitment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-service
  template:
    metadata:
      labels:
        app: resume-service
    spec:
      containers:
        - name: resume-service
          image: ghcr.io/OWNER/ai-recruitment-resume-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: recruitment-config
            - secretRef:
                name: recruitment-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: resume-service
  namespace: ai-recruitment
spec:
  type: LoadBalancer
  selector:
    app: resume-service
  ports:
    - port: 8000
      targetPort: 8000
