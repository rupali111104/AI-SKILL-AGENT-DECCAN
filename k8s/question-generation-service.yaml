apiVersion: apps/v1
kind: Deployment
metadata:
  name: question-generation-service
  namespace: ai-recruitment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: question-generation-service
  template:
    metadata:
      labels:
        app: question-generation-service
    spec:
      containers:
        - name: question-generation-service
          image: ghcr.io/OWNER/ai-recruitment-question-generation-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: question-generation-service
  namespace: ai-recruitment
spec:
  selector:
    app: question-generation-service
  ports:
    - port: 8002
      targetPort: 8002
