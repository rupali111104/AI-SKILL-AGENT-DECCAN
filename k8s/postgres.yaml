apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ai-recruitment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: recruitment
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recruitment-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-recruitment
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
