apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-matching-service
  namespace: ai-recruitment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skill-matching-service
  template:
    metadata:
      labels:
        app: skill-matching-service
    spec:
      containers:
        - name: skill-matching-service
          image: ghcr.io/OWNER/ai-recruitment-skill-matching-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: recruitment-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: skill-matching-service
  namespace: ai-recruitment
spec:
  selector:
    app: skill-matching-service
  ports:
    - port: 8001
      targetPort: 8001
