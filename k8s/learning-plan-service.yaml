apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-plan-service
  namespace: ai-recruitment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learning-plan-service
  template:
    metadata:
      labels:
        app: learning-plan-service
    spec:
      containers:
        - name: learning-plan-service
          image: ghcr.io/OWNER/ai-recruitment-learning-plan-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: learning-plan-service
  namespace: ai-recruitment
spec:
  selector:
    app: learning-plan-service
  ports:
    - port: 8003
      targetPort: 8003
